name: LLM evals

# Grades the golden dataset with the real models and enforces quality gates.
# Costs provider tokens, so it runs weekly, on demand, or on PRs labelled `run-evals`.
# Requires a GROQ_API_KEY repository secret.

on:
  workflow_dispatch:
    inputs:
      sample:
        description: "Items to grade (0 = all 66; a stratified subset otherwise)"
        default: "24"
      repeats:
        description: "Runs per item (2+ measures consistency)"
        default: "1"
      pipelines:
        description: "Pipelines to compare"
        default: "graph,legacy"
  schedule:
    - cron: "0 3 * * 1"  # Mondays 03:00 UTC
  pull_request:
    types: [labeled, synchronize]

permissions:
  contents: read

concurrency:
  group: llm-evals
  cancel-in-progress: false

jobs:
  evals:
    if: github.event_name != 'pull_request' || contains(github.event.pull_request.labels.*.name, 'run-evals')
    runs-on: ubuntu-latest
    timeout-minutes: 90
    defaults:
      run:
        working-directory: api
    env:
      GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
      DATABASE_URL: mongodb://127.0.0.1:9/evals-never-connect
      SECRET_KEY: ci-evals-only-not-a-secret-0123456789
      SAMPLE: ${{ inputs.sample || '24' }}
      REPEATS: ${{ inputs.repeats || '1' }}
      PIPELINES: ${{ inputs.pipelines || 'graph,legacy' }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: api/requirements*.txt
      - run: pip install -r requirements.txt
      - name: Check provider key
        run: |
          if [ -z "$GROQ_API_KEY" ]; then
            echo "::error::Add a GROQ_API_KEY repository secret (Settings > Secrets and variables > Actions)."
            exit 1
          fi
      - name: Grade the golden set
        run: |
          set +e
          python -m evals run --out eval-run --sample "$SAMPLE" --repeats "$REPEATS" --pipelines "$PIPELINES"
          code=$?
          if [ $code -eq 3 ]; then
            echo "::warning::Provider daily quota reached; gates apply to the runs that completed."
          elif [ $code -ne 0 ]; then
            exit $code
          fi
      - name: Report and quality gates
        run: python -m evals report eval-run --check evals/thresholds.json
      - name: Publish report
        if: always()
        run: |
          if [ -f eval-run/report.md ]; then cat eval-run/report.md >> "$GITHUB_STEP_SUMMARY"; fi
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: eval-results-${{ github.run_id }}
          path: api/eval-run/
          retention-days: 30
